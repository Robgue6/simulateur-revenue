<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Simulateur Avancé Webinar / Closing</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #4285f4;
      --success-color: #34a853;
      --warning-color: #fbbc05;
      --danger-color: #ea4335;
      --background-color: #1a1f36;
      --card-background: #242b42;
      --text-primary: #ffffff;
      --text-secondary: #a0aec0;
      --border-color: #2d3748;
      --hover-color: #2f3850;
      --stat-card-bg: #2d3748;
      --input-bg: #1e2538;
    }

    :root.light {
      --background-color: #f9fafb;
      --card-background: #ffffff;
      --text-primary: #1a202c;
      --text-secondary: #4a5568;
      --border-color: #cbd5e0;
      --hover-color: #e2e8f0;
      --stat-card-bg: #edf2f7;
      --input-bg: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--background-color);
      color: var(--text-primary);
      line-height: 1.5;
      padding: 1.5rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    .stat-card {
      background: var(--stat-card-bg);
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border-color);
    }

    .stat-card .value {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0.25rem 0;
      color: var(--text-primary);
    }

    .stat-card .label {
      color: var(--text-secondary);
      font-size: 0.75rem;
    }

    .inputs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      background: var(--card-background);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    input[type="number"] {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.875rem;
      transition: all 0.2s ease;
      background-color: var(--input-bg);
      color: var(--text-primary);
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.2);
    }

    .results-panel {
      background: var(--card-background);
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid var(--border-color);
      height: 100%;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    .result-item {
      padding: 1rem;
      border-radius: 8px;
      background: var(--stat-card-bg);
      border: 1px solid var(--border-color);
    }

    .result-item p {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0.25rem 0;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .result-item strong {
      font-weight: 600;
      color: var(--text-primary);
    }

    .divider {
      height: 1px;
      background: var(--border-color);
      margin: 0.75rem 0;
    }

    .actions { display: flex; gap: 0.5rem; }
    .toggle-btn, .reset-btn { background: var(--primary-color); border: none; color: #fff; border-radius: 6px; padding: 0.4rem 0.75rem; font-size: 0.75rem; cursor: pointer; }
    .toggle-btn:hover, .reset-btn:hover { opacity: 0.9; }

    @media (max-width: 1200px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .inputs-grid {
        grid-template-columns: 1fr;
      }

      .results-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 Simulateur Avancé Webinar / Closing</h1>
      <div class="actions">
        <button id="themeToggle" class="toggle-btn">Mode clair</button>
        <button id="resetButton" class="reset-btn">Réinitialiser</button>
      </div>
    </div>

    <div class="main-content">
      <div class="left-panel">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="label">Nombre de leads</div>
            <div class="value" id="leads-stat">-</div>
          </div>
          <div class="stat-card">
            <div class="label">CA Total</div>
            <div class="value" id="revenue-stat">-</div>
          </div>
          <div class="stat-card">
            <div class="label">Profit Net</div>
            <div class="value" id="profit-stat">-</div>
          </div>
          <div class="stat-card">
            <div class="label">Ventes Conclues</div>
            <div class="value" id="sales-stat">-</div>
          </div>
        </div>

        <div class="inputs-grid">
          <div class="input-group">
            <label>Taille de l'audience</label>
            <input type="number" id="audienceSize" value="10000" />
          </div>
          <div class="input-group">
            <label>Taux de conversion leads (%)</label>
            <input type="number" id="leadConversionRate" value="10" />
          </div>
          <div class="input-group">
            <label>Coût par lead (€)</label>
            <input type="number" id="costPerLead" value="3" />
          </div>
          <div class="input-group">
            <label>Taux présence webinar (%)</label>
            <input type="number" id="presenceRate" value="40" />
          </div>
          <div class="input-group">
            <label>Taux RDV bookés (%)</label>
            <input type="number" id="rdvRate" value="30" />
          </div>
          <div class="input-group">
            <label>Taux closing RDV (%)</label>
            <input type="number" id="closingRate" value="25" />
          </div>
          <div class="input-group">
            <label>Prix offre principale (€)</label>
            <input type="number" id="offerPrice" value="2000" />
          </div>
          <div class="input-group">
            <label>Taux d'upsell (%)</label>
            <input type="number" id="upsellRate" value="20" />
          </div>
          <div class="input-group">
            <label>Montant upsell (€)</label>
            <input type="number" id="upsellAmount" value="1000" />
          </div>
          <div class="input-group">
            <label>Commission closers (%)</label>
            <input type="number" id="closerCommission" value="15" />
          </div>
        </div>
      </div>

      <div class="results-panel">
        <div class="results-grid" id="results">
        </div>
      </div>
    </div>
  </div>

  <script>
    const inputs = document.querySelectorAll('input');
    const resultsDiv = document.getElementById('results');
    const leadsStat = document.getElementById('leads-stat');
    const revenueStat = document.getElementById('revenue-stat');
    const profitStat = document.getElementById('profit-stat');
    const salesStat = document.getElementById('sales-stat');
    const themeToggle = document.getElementById("themeToggle");
    const resetButton = document.getElementById("resetButton");

    const defaultValues = {
      audienceSize: 10000,
      leadConversionRate: 10,
      costPerLead: 3,
      presenceRate: 40,
      rdvRate: 30,
      closingRate: 25,
      offerPrice: 2000,
      upsellRate: 20,
      upsellAmount: 1000,
      closerCommission: 15
    };

    function formatCurrency(value) {
      return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(value);
    }

    function calculate() {
      const audienceSize = parseFloat(document.getElementById('audienceSize').value);
      const leadConversionRate = parseFloat(document.getElementById('leadConversionRate').value) / 100;
      const leads = Math.round(audienceSize * leadConversionRate);
      const costPerLead = parseFloat(document.getElementById('costPerLead').value);
      const presenceRate = parseFloat(document.getElementById('presenceRate').value) / 100;
      const rdvRate = parseFloat(document.getElementById('rdvRate').value) / 100;
      const closingRate = parseFloat(document.getElementById('closingRate').value) / 100;
      const offerPrice = parseFloat(document.getElementById('offerPrice').value);
      const upsellRate = parseFloat(document.getElementById('upsellRate').value) / 100;
      const upsellAmount = parseFloat(document.getElementById('upsellAmount').value);
      const closerCommission = parseFloat(document.getElementById('closerCommission').value) / 100;

      const adSpend = leads * costPerLead;
      const attendees = leads * presenceRate;
      const rdvBooked = attendees * rdvRate;
      const closedSales = rdvBooked * closingRate;

      const coreRevenue = closedSales * offerPrice;
      const upsellRevenue = closedSales * upsellRate * upsellAmount;
      const totalRevenue = coreRevenue + upsellRevenue;

      const closerCost = coreRevenue * closerCommission;
      const netProfit = totalRevenue - adSpend - closerCost;
      const infopreneurShare = netProfit / 2;
      const agencyShare = netProfit / 2;

      // Update stats
      leadsStat.textContent = Math.round(leads).toLocaleString();
      revenueStat.textContent = formatCurrency(totalRevenue);
      profitStat.textContent = formatCurrency(netProfit);
      salesStat.textContent = Math.round(closedSales).toLocaleString();

      resultsDiv.innerHTML = `
        <div class="result-item">
          <p><span>👥 Audience totale</span> <strong>${Math.round(audienceSize).toLocaleString()}</strong></p>
          <p><span>🎯 Leads générés</span> <strong>${Math.round(leads).toLocaleString()}</strong></p>
          <p><span>📊 Présents au webinar</span> <strong>${Math.round(attendees).toLocaleString()}</strong></p>
        </div>
        <div class="result-item">
          <p><span>📞 RDV bookés</span> <strong>${Math.round(rdvBooked).toLocaleString()}</strong></p>
          <p><span>✅ Ventes conclues</span> <strong>${Math.round(closedSales).toLocaleString()}</strong></p>
          <p><span>💰 CA offre principale</span> <strong>${formatCurrency(coreRevenue)}</strong></p>
        </div>
        <div class="result-item" style="background: var(--card-background); border: 2px solid var(--primary-color);">
          <p style="color: var(--text-primary); font-weight: 600; margin-bottom: 0.5rem;">📅 Projection Annuelle (12 webinars)</p>
          <p><span>📈 CA total</span> <strong>${formatCurrency(totalRevenue * 12)}</strong></p>
          <p><span>💎 Profit net</span> <strong>${formatCurrency(netProfit * 12)}</strong></p>
          <p><span>🎯 Ventes totales</span> <strong>${Math.round(closedSales * 12).toLocaleString()}</strong></p>
        </div>
        <div class="result-item">
          <p><span>💸 CA upsell</span> <strong>${formatCurrency(upsellRevenue)}</strong></p>
          <p><span>🎯 Dépenses pub</span> <strong>${formatCurrency(adSpend)}</strong></p>
          <p><span>🤝 Commission closers</span> <strong>${formatCurrency(closerCost)}</strong></p>
        </div>
        <div class="result-item">
          <p style="color: var(--text-primary); font-weight: 600; margin-bottom: 0.5rem;">💰 Par Webinar</p>
          <p><span>👤 Part Infopreneur (50%)</span> <strong>${formatCurrency(infopreneurShare)}</strong></p>
          <p><span>🏗️ Part Agence (50%)</span> <strong>${formatCurrency(agencyShare)}</strong></p>
        </div>
        <div class="result-item" style="background: var(--card-background); border: 2px solid var(--success-color);">
          <p style="color: var(--text-primary); font-weight: 600; margin-bottom: 0.5rem;">💰 Projection Annuelle</p>
          <p><span>👤 Part Infopreneur (50%)</span> <strong>${formatCurrency(infopreneurShare * 12)}</strong></p>
          <p><span>🏗️ Part Agence (50%)</span> <strong>${formatCurrency(agencyShare * 12)}</strong></p>
        </div>
      `;
    }

    inputs.forEach(input => {
      input.addEventListener('input', calculate);
    });
    themeToggle.addEventListener("click", () => {
      document.documentElement.classList.toggle("light");
      const isLight = document.documentElement.classList.contains("light");
      themeToggle.textContent = isLight ? "Mode sombre" : "Mode clair";
    });

    resetButton.addEventListener("click", () => {
      Object.entries(defaultValues).forEach(([id, val]) => {
        const input = document.getElementById(id);
        if (input) input.value = val;
      });
      calculate();
    });

    calculate();
  </script>
</body>
</html>
